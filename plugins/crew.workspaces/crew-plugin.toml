id = "crew.workspaces"
name = "Workspace Inspector"
version = "1.0.0"
min_crew_version = "0.5.0"
description = "Inspect workspace, pane and agent state through the running Crew server."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "list"
title = "List workspaces"
command = ["{crew}", "workspace", "list"]

[[actions]]
id = "agents"
title = "List agents"
command = ["{crew}", "agent", "list"]

[[actions]]
id = "snapshot"
title = "Inspect workspace snapshot"
command = ["{crew}", "api", "snapshot"]
