name: CI
on:
  # Hosted minutes are exhausted. Normal pushes/PRs use scripts/validate_local.py.
  workflow_dispatch:
    inputs:
      allow_hosted_minutes:
        description: 'Explicitly authorize GitHub-hosted runner usage for this run'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crew-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'
  RUST_BACKTRACE: '1'

defaults:
  run:
    shell: bash

jobs:
  test:
    if: ${{ inputs.allow_hosted_minutes == true }}
    name: ${{ matrix.name }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, ext: '' }
          - { name: Windows x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc, ext: '.exe' }
          - { name: macOS arm64, runner: macos-15, target: aarch64-apple-darwin, ext: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Repository guard
        run: test "$GITHUB_REPOSITORY" = 'urtiger101-tw/Crew'
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2; upstream tag verified 2026-10-20
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Prepare logs
        run: mkdir -p ci-logs
      - name: Format
        run: cargo fmt --all --check 2>&1 | tee ci-logs/format.log
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee ci-logs/clippy.log
      - name: Unit tests
        run: cargo test --locked 2>&1 | tee ci-logs/unit.log
      - name: Release tooling tests
        run: python scripts/package_release.py self-test 2>&1 | tee ci-logs/release-tooling.log
      - name: Local validation tooling tests
        run: python -B scripts/test_local_validation.py 2>&1 | tee ci-logs/local-tooling.log
      - name: Build executable
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release --bins --target ${{ matrix.target }} 2>&1 | tee ci-logs/build.log
      - name: Automation API smoke
        timeout-minutes: 8
        run: python scripts/api_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/api.log
      - name: Workspace smoke
        timeout-minutes: 5
        run: python scripts/workspace_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/workspace.log
      - name: Workspace move smoke
        timeout-minutes: 5
        run: python scripts/workspace_move_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/workspace-move.log
      - name: Metadata smoke
        timeout-minutes: 5
        run: python scripts/metadata_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/metadata.log
      - name: Worktree smoke
        timeout-minutes: 5
        run: python scripts/worktree_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/worktree.log
      - name: Agent identity smoke
        timeout-minutes: 5
        run: python scripts/agent_identity_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/agent-identity.log
      - name: Bridge and events smoke
        timeout-minutes: 5
        run: python scripts/bridge_events_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/bridge-events.log
      - name: Workspace transfer smoke
        timeout-minutes: 5
        run: python scripts/workspace_transfer_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/workspace-transfer.log
      - name: Metadata presentation smoke
        timeout-minutes: 5
        run: python scripts/presentation_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/presentation.log
      - name: Agent detection smoke
        timeout-minutes: 5
        run: python scripts/agent_detection_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/agent-detection.log
      - name: Plugin lifecycle smoke
        timeout-minutes: 5
        run: python scripts/plugin_smoke.py target/${{ matrix.target }}/release/crew${{ matrix.ext }} 2>&1 | tee ci-logs/plugin.log
      - name: SSH federation smoke
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo install -d -m 0755 /run/sshd
          python scripts/ssh_federation_smoke.py "$PWD/target/${{ matrix.target }}/release/crew${{ matrix.ext }}" --logs ci-logs/ssh-federation 2>&1 | tee ci-logs/ssh-federation.log
      - name: Build Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: python scripts/windows_installer.py --output installer-dist --logs ci-logs/installer 2>&1 | tee ci-logs/installer-build.log
      - name: Windows installer lifecycle smoke
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: python scripts/windows_installer_smoke.py --input installer-dist --logs ci-logs/installer 2>&1 | tee ci-logs/installer-lifecycle.log
      - name: Upload test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-logs-${{ matrix.runner }}
          path: ci-logs/
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Crew CI Gate
    if: ${{ always() && inputs.allow_hosted_minutes == true }}
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every platform
        env:
          PLATFORM_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$PLATFORM_RESULT" != success ]; then
            echo "Required platform jobs did not all succeed: $PLATFORM_RESULT" >&2
            exit 1
          fi
