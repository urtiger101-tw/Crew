[package]
name = "crew"
version = "0.5.0"
edition = "2024"
default-run = "crew"
description = "Cross-platform terminal workspaces for coding agent teams"
license = "MIT"
repository = "https://github.com/urtiger101-tw/Crew"

[[bin]]
name = "crew"
path = "src/main.rs"

[[bin]]
name = "tmuxlike"
path = "src/bin/tmuxlike.rs"
test = false
bench = false

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["serde"] }
dirs = "7.0.0"
interprocess = "2.4.4"
portable-pty = "0.9.0"
regex = { version = "1.11", default-features = false, features = ["std", "unicode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp"] }
